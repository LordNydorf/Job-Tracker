services:
  - type: web
    name: job-tracker-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: jdbc:sqlite:/data/jobtracker.db
      - key: API_KEY
        generateValue: true
