services:
  - type: web
    name: job-tracker-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
        # Set to your Free Neon / Supabase Postgres URL (e.g. postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require)
        # Defaults to local SQLite if unset.
      - key: API_KEY
        generateValue: true
